name: Actualizar precios públicos diariamente
on:
  push:
    branches: [main]
    paths:
      - actualizar_precios.py
      - fuentes.json
      - tests/**
      - .github/workflows/actualizar.yml
  workflow_dispatch:
  schedule:
    - cron: "25 11 * * *"
permissions:
  contents: write
concurrency:
  group: actualizacion-precios-publicos
  cancel-in-progress: false
jobs:
  actualizacion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar programa
        run: python -m unittest discover -s tests -v
      - name: Consultar precios reales
        run: python actualizar_precios.py
      - name: Publicar archivo validado
        run: |
          test -s docs/precios_actualizados.json
          cp docs/precios_actualizados.json precios_actualizados.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/precios_actualizados.json precios_actualizados.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo de precios comprobados"
            git push
          fi
